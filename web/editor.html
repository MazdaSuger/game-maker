<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>ノベルメーカー — ブラウザ版エディタ</title>
  <link rel="stylesheet" href="editor.css?v=20260611f" />
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div class="brand">📖 ノベルメーカー Web</div>
      <button id="btn-new">新規</button>
      <label id="btn-open" for="file-open" class="fakebtn" role="button" tabindex="0">開く(.nvproj)</label>
      <button id="btn-save" class="primary">保存(.nvproj)</button>
      <button id="btn-play">▶ テスト</button>
      <button id="btn-export">⬇ HTML書き出し</button>
      <button id="btn-zip">⬇ Cloudflare用ZIP</button>
      <span class="spacer"></span>
      <span class="pname" id="pname"></span>
      <!-- iOS対策: accept指定なし＋labelで直接ピッカーを開く（display:noneにしない） -->
      <input type="file" id="file-open" class="vhide" />
    </div>

    <div id="body">
      <div id="nav"></div>
      <div id="content"></div>
    </div>
  </div>

  <!-- 汎用モーダル -->
  <div id="modal" class="overlay hidden"><div class="modal" id="modal-box"></div></div>

  <!-- テストプレイ -->
  <iframe id="playframe" class="hidden" allow="autoplay"></iframe>
  <button id="playclose" class="hidden">✕ 閉じる</button>

  <script src="model.js?v=20260611f"></script>
  <script src="engine.js?v=20260611f"></script>
  <script src="editor.js?v=20260611f"></script>
</body>
</html>
