name: Build Desktop Apps

# 手動実行（任意でリリースタグを指定）または v* タグ push でビルド。
# - 成果物（zip / dmg / tar.gz）は Actions の Artifacts からダウンロード可能。
# - タグ push、または手動実行で「リリースタグ」を入力した場合は、
#   ビルド完了後に GitHub Release を作成して成果物を添付します。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "リリースタグ（例: v1.0.0）。入力するとビルド後にReleaseを作成します。空ならビルドのみ。"
        required: false
        default: ""
      prerelease:
        description: "プレリリースとして公開する"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # =====================================================================
  # Windows: NovelMaker.exe（ワンフォルダ）を zip 化
  # =====================================================================
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm packaging/novelmaker.spec
      - name: Package zip
        run: Compress-Archive -Path dist/NovelMaker/* -DestinationPath NovelMaker-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NovelMaker-windows-x64
          path: NovelMaker-windows-x64.zip

  # =====================================================================
  # macOS: NovelMaker.app（universal2 = Intel + Apple Silicon）を DMG 化
  # =====================================================================
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build (PyInstaller, universal2)
        run: pyinstaller --noconfirm packaging/novelmaker.spec
      - name: Verify universal2 binary
        run: |
          BIN="dist/NovelMaker.app/Contents/MacOS/NovelMaker"
          lipo -archs "$BIN" || true
      - name: Create DMG
        run: |
          mkdir -p dmg_root
          cp -R "dist/NovelMaker.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "NovelMaker" \
            -srcfolder dmg_root \
            -ov -format UDZO \
            "NovelMaker-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: NovelMaker-macos-universal
          path: NovelMaker-macos-universal.dmg

  # =====================================================================
  # Linux（おまけ）: ワンフォルダを tar.gz 化
  # =====================================================================
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm packaging/novelmaker.spec
      - name: Package tar.gz
        run: tar -czf NovelMaker-linux-x64.tar.gz -C dist NovelMaker
      - uses: actions/upload-artifact@v4
        with:
          name: NovelMaker-linux-x64
          path: NovelMaker-linux-x64.tar.gz

  # =====================================================================
  # リリース: 3OSのビルド完了後、成果物を添付して GitHub Release を作成
  #   - v* タグ push 時、または 手動実行で release_tag を入力した時のみ実行
  # =====================================================================
  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Determine tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: List artifacts
        run: ls -R dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "NovelMaker ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/**/*.zip
            dist/**/*.dmg
            dist/**/*.tar.gz
